<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EESSI Pensjon · Dokumentasjon</title>
    <script>
      // Apply the stored theme and sidebar state before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem("ep-docs-theme") || "system";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          if (localStorage.getItem("ep-docs-sidebar") === "collapsed") {
            document.documentElement.setAttribute("data-sidebar", "collapsed");
          }
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
